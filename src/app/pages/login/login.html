<div class="grid min-h-screen place-items-center bg-gradient-to-br from-cream to-cream-deep p-6">
  <form
    class="flex w-full max-w-sm flex-col gap-4 rounded-3xl bg-white p-8 shadow-card"
    (ngSubmit)="submit()"
  >
    <app-brand size="lg" />

    <div class="mt-1">
      <h1 class="text-2xl">لوحة تحكم المحتوى</h1>
      <p class="mt-1 text-sm text-navy-600">سجّل الدخول لتعديل محتوى الموقع.</p>
    </div>

    @if (!configured) {
      <app-alert type="warn">
        لم يتم ضبط مفاتيح Supabase بعد. أضف المفتاح في ملف الإعدادات ثم أعد التشغيل.
      </app-alert>
    }

    <label class="flex flex-col gap-1.5">
      <span class="field-label">البريد الإلكتروني</span>
      <input type="email" class="field-control" name="email" [(ngModel)]="email" required autocomplete="username" />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="field-label">كلمة السر</span>
      <input type="password" class="field-control" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>

    @if (error()) { <app-alert type="error">{{ error() }}</app-alert> }

    <button type="submit" class="btn mt-1 w-full" [disabled]="loading() || !configured">
      {{ loading() ? 'جارٍ الدخول…' : 'تسجيل الدخول' }}
    </button>
  </form>
</div>
