<app-section-shell [sectionKey]="key">
  @if (gridFields.length) {
    <div class="card p-5 md:p-7">
      <div class="grid grid-cols-1 gap-x-8 gap-y-6 lg:grid-cols-2">
        @for (f of gridFields; track f.key) {
          <div [class.lg:col-span-2]="span(f)">
            <app-field-editor [schema]="f" [model]="model" />
          </div>
        }
      </div>
    </div>
  }

  @for (f of blockFields; track f.key) {
    <div class="card mt-6 p-5 md:p-7">
      <app-field-editor [schema]="f" [model]="model" />
    </div>
  }
</app-section-shell>
