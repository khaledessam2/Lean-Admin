<div class="flex h-screen overflow-hidden bg-cream">
  <app-sidebar [open]="sidebarOpen()" (navigate)="sidebarOpen.set(false)" />

  <!-- خلفية معتمة على الجوال -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-20 bg-navy/40 backdrop-blur-sm md:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-topbar
      [email]="email"
      [siteUrl]="siteUrl"
      (logout)="logout()"
      (toggleMenu)="sidebarOpen.set(!sidebarOpen())"
    />

    <main class="flex-1 overflow-y-auto">
      @if (store.loading()) {
        <div class="flex min-h-[60vh] flex-col items-center justify-center gap-3 text-navy-600">
          <span class="h-8 w-8 animate-spin rounded-full border-2 border-line border-t-brand"></span>
          <span>جارٍ تحميل المحتوى…</span>
        </div>
      } @else if (!store.ready()) {
        <div class="mx-auto max-w-md p-8">
          <p class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-600">
            {{ store.error() }}
          </p>
        </div>
      } @else {
        <router-outlet />
      }
    </main>
  </div>
</div>
